# =====================================================================
#  Wind turbine emulator – ACS800 (DTC) via RETA-01 Modbus/TCP
# =====================================================================

# ---------------- Drive link ----------------------------------------
# true  = built-in simulated drive (test without hardware)
# false = real RETA-01
drive.simulate=true
# RETA-01 IP address (drive parameters 51.04..51.07 when DHCP 51.03 = 0)
drive.host=192.168.0.16
drive.port=502
drive.unitId=1
drive.timeoutMs=200
# PDU address of register 40001. Most masters/RETA-01: 0. Set 1 if your
# addressing is off by one (status word reads look like REF values).
drive.registerBase=0
# RETA-01 data-set registers (number after 4xxxx):
#   40001 DS1.1 Control Word  40002 DS1.2 REF1  40003 DS1.3 REF2
#   40004 DS2.1 Status Word   40005 DS2.2 ACT1  40006 DS2.3 ACT2
drive.reg.controlWord=1
drive.reg.statusWord=4
# Use FC23 (read/write in one telegram) instead of FC16 + FC03
drive.useFc23=false

# ---------------- Emulation mode ------------------------------------
# SPEED  : drive in speed control (EXT1, REF1); emulator integrates the
#          virtual rotor. Robust for any inertia ratio (recommended).
# TORQUE : drive in torque control (EXT2, REF2); emulator sends aero torque
#          minus inertia compensation. Use when J_emulated/J_rig is small.
emulator.controlMode=SPEED
# TORQUE mode: set control-word bit 11 (EXT2) – ACS800 11.02 = COMM.CW
drive.torqueOnExt2=true

# ---------------- Motor / test rig ----------------------------------
motor.nominalPowerW=15000
motor.nominalRpm=1475
# total inertia of motor + coupling + load generator
motor.rigInertiaKgm2=0.35
motor.rigViscousNmPerRadS=0.02

# ---------------- Drive fieldbus scaling ----------------------------
# REF1 20000  = 11.05 EXT REF1 MAXIMUM [rpm]
drive.ref1FullScaleRpm=1500
# REF2 10000  = 11.08 EXT REF2 MAXIMUM [% of motor nominal torque]
drive.ref2FullScalePct=100
# ACT1 20000  = speed scaling of the drive [rpm] (check firmware manual)
drive.act1FullScaleRpm=1500
# ACT2 10000  = 100 % motor nominal torque
drive.act2FullScalePct=100

# ---------------- Emulated turbine ----------------------------------
turbine.rotorRadiusM=38.5
turbine.airDensity=1.225
turbine.ratedPowerW=1500000
turbine.ratedRotorRpm=20.0
turbine.rotorInertiaKgm2=4.0e6
turbine.blades=3
turbine.cutInWind=3.0
turbine.cutOutWind=25.0
# torque dip each time a blade passes the tower (0 = off)
turbine.towerShadowAmplitude=0.03

# ---------------- Scaling turbine -> rig ----------------------------
# turbine rated power is mapped to this fraction of motor nominal power
scaling.powerUsage=0.8
# TORQUE mode only: inertia-compensation gain (0..1) and accel filter
scaling.inertiaCompensationGain=1.0
scaling.accelFilterTauS=0.05

# ---------------- Pitch control -------------------------------------
pitch.kpDegPerPu=60
pitch.kiDegPerSPerPu=30
pitch.rateLimitDegPerS=8
pitch.maxDeg=90

# ---------------- Wind ----------------------------------------------
wind.meanSpeed=9.0
wind.turbulenceIntensity=0.10
wind.turbulenceLengthScaleM=150
# optional CSV "time_s,wind_ms" (looped); leave empty for manual
wind.profileCsv=

# ---------------- Loop & safety -------------------------------------
loop.periodMs=20
safety.maxMotorRpm=1700
safety.maxTorquePct=150
safety.torqueRampPctPerS=300
safety.maxConsecutiveCommErrors=5

log.csv=emulator_log.csv
